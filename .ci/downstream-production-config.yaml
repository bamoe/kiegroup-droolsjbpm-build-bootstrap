version: "2.1"

dependencies: ./product-projects-dependencies.yaml

default:
  build-command:
    current: mvn clean install -Dproductized=true -Dmaven.test.failure.ignore=true  -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3
    after:
      upstream: rm -rf ./*