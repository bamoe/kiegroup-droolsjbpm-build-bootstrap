version: "2.1"

# The scope of this build is to execute e2e and migration tests that also requires the productize profile
# No unit tests, no integration tests, no checks

# Legenda
# current: the command executed when the PR is opened in the given repo
# upstream: the command executed when the given repo is upstream compared of the one where the PR is open
# downstream: the command executed when the given repo is downstream compared of the one where the PR is open
# #####
# We do not need to verify tests in upstream projects, since those do not risk to be broken by modifications in downstream ones; so, we use the default upstream command
# On the other side, any downstream repo could be broken by upstream modifications. In this case, we customize the downstream command on a per-repo base to match the current building status (NB/PB/FB) or the repo

# -Dmaven.resolver.transport=native forces use of transport-http (it is the default for maven 3.9.0, but just to be sure)
# See https://maven.apache.org/resolver-1.x/configuration.html for native http transport configurations

## TWEAKS
# -T1C: build modules in parallel, one thread per available core; maven reactor ensures that all modules that depend on each other will run sequentially
# -Dparallel=all  : execute tests in parallel: WARN: this could unmask flaky tests depending on ordered/single execution
# -DperCoreThreadCount=true :one thread per available core
# -XX:TieredStopAtLevel=1 : use only the C1 (fast startup) compiler; short explanation: Tiered compilation contains both "C1 Client compiler" (fast start-up - short-lived execution) and "C2 server ccompiler" () long-lived process, performance optimization over time)
## for Maven build, we do not need both, only C1
# -XX:+UseParallelGC

dependencies: ./project-dependencies.yaml
##export MVN_TWEAKS=-T1C -Dparallel=all -DuseUnlimitedThreads=true -Dcargo.ignore.failures=true -Dmaven.test.failure.ignore=true

pre: |
  export MVN_TWEAKS=-T1C
  export JVM_TWEAKS=-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC
  export FLAGS=-Dprofile -Dproductize -DskipTests -Pno-showcase -Dgwt.compiler.localWorkers=2 -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true
  export BUILD_MVN_OPTS=${{ env.BUILD_MVN_OPTS }} ${{ env.MVN_TWEAKS }} ${{ env.FLAGS }}  -Dmaven.resolver.transport=native -Daether.connector.http.connectionMaxTtl=25 -Daether.connector.http.retryHandler.count=2 -Daether.connector.requestTimeout=300000 -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
  echo "BUILD_MVN_OPTS=${{ env.BUILD_MVN_OPTS }}"
  echo "JVM_TWEAKS=${{ env.JVM_TWEAKS }}"
  echo "FLAGS=${{ env.FLAGS }}"
  java -version

default:
  build-command:
    current: mvn ${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC" -e -nsu clean install -Dfull -Dmaven.test.redirectTestOutputToFile=true
    upstream: mvn ${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC" -e  clean install -Dfull
    downstream: mvn ${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC" -e -nsu clean install -Dfull -Dmaven.test.redirectTestOutputToFile=true
    after:
      upstream: rm -rf ./*

build:
  # This override shouldn't be required, added just to have 1:1 parity with full-downstream-build (enforcer, spotbug, checkstyle and revapi skips are not necessary, then have been removed)
  - project: bamoe/kiegroup-appformer
    build-command:
      upstream: mvn -e clean install ${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC"
    archive-artifacts:
      path: |
        **/dashbuilder-runtime.war

  # This override shouldn't be required, added just to have 1:1 parity with full-downstream-build (enforcer, spotbug, checkstyle and revapi skips are not necessary, then have been removed)
  - project: bamoe/kiegroup-drools
    build-command:
      upstream: mvn -e clean install ${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC"

  # This override is not required. However, removing it causes the CI build to hang indefinitely.
  - project: bamoe/kiegroup-jbpm
    build-command:
      current: mvn -e -fae -nsu clean install -Dfull ${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC"
      downstream: mvn -e -fae -nsu clean install -Dfull ${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC"

  # Optaplanner is NOT part of BAMOE project.
  # - project: bamoe/kiegroup-optaplanner
  #   build-command:
  #     current: mvn -e -fae -nsu clean install -Dfull -DskipTests ${{ env.BUILD_MVN_OPTS }}
  #     upstream: mvn -e clean install -DskipTests -Dgwt.compiler.skip=true -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true ${{ env.BUILD_MVN_OPTS }}

  # 1:1 copied from full-downstream-build. Removed tests skip
  - project: bamoe/kiegroup-kie-wb-common
    build-command:
      current: mvn ${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC" -e -nsu clean install -Dfull -Dmaven.test.redirectTestOutputToFile=true
      upstream: mvn ${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC" -e clean install
      downstream: mvn ${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC" -e -nsu clean install -Dfull -Dmaven.test.redirectTestOutputToFile=true
    archive-artifacts:
      path: |
        **/target/screenshots/**

  # Override required to enable cargo integration tests (1:1 copy from full-downstream-build) TODO: Tests failures are currently IGNORED
  - project: bamoe/kiegroup-droolsjbpm-integration
    build-command:
      current: mvn ${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC" -e -nsu clean install -Dfull -Dmaven.test.redirectTestOutputToFile=true
      downstream: mvn ${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G -XX:TieredStopAtLevel=1 -XX:+UseParallelGC" -e -nsu clean install -Dfull -Dmaven.test.redirectTestOutputToFile=true

  # In full-downstream-config is skipped, but actually compiled in 8.1 
  # - project: bamoe/kiegroup-process-migration-service
  #   skip: true

  - project: bamoe/kiegroup-kie-docs
    skip: true

  - project: bamoe/kiegroup-droolsjbpm-tools
    skip: true

