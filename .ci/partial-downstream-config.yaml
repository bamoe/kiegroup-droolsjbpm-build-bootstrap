version: "2.1"

# Legenda
# current: the command executed when the PR is opened in the given repo
# upstream: the command executed when the given repo is upstream compared of the one where the PR is open
# downstream: the command executed when the given repo is downstream compared of the one where the PR is open
# #####
# We do not need to verify tests in upstream projects, since those do not risk to be broken by modifications in downstream ones; so, we use the default upstream command
# On the other side, any downsteam repo could be broken by upstream modifications. In this case, we customize the downstream command on a per-repo base to match the current building status (NB/PB/FB) or the repo



dependencies: ./project-dependencies.yaml

pre: |
  export BUILD_MVN_OPTS=${{ env.BUILD_MVN_OPTS }} -DargLine="-Xmx24G" -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3
  echo "BUILD_MVN_OPTS=${{ env.BUILD_MVN_OPTS }}"
  java -version

default:
  build-command:
    current: mvn ${{ env.BUILD_MVN_OPTS }} -e -nsu -T1C clean install -Dfull
    upstream: mvn ${{ env.BUILD_MVN_OPTS }} -e -T1C clean install -Dfull -DskipTests -Dgwt.compiler.skip=true -Dgwt.skipCompilation=true -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true
    downstream: mvn ${{ env.BUILD_MVN_OPTS }} -e -nsu clean install -Dfull -Dcontainer=wildfly -Dcontainer.profile=wildfly -Dintegration-tests=true -Dcargo.ignore.failures=true -Dmaven.test.failure.ignore=true -Dmaven.test.redirectTestOutputToFile=true -Dgwt.compiler.localWorkers=1 -Dwebdriver.firefox.bin=/opt/tools/firefox-91esr/firefox-bin -Dgwt.skipCompilation=true
    after:
      upstream: rm -rf ./*

build:
  # This override shouldn't be required, added just to have 1:1 parity with full-downstream-build (enforcer, spotbug, checkstyle and revapi skips are not necessary, then have been removed)
  - project: dba/kiegroup-appformer
    build-command:
      upstream: mvn -e clean install -DskipTests -Dgwt.compiler.skip=true -Dgwt.skipCompilation=true ${{ env.BUILD_MVN_OPTS }}
    archive-artifacts:
      path: |
        **/dashbuilder-runtime.war

  # This override shouldn't be required, added just to have 1:1 parity with full-downstream-build (enforcer, spotbug, checkstyle and revapi skips are not necessary, then have been removed)
  - project: dba/kiegroup-drools
    build-command:
      upstream: mvn -e clean install -DskipTests -Dgwt.compiler.skip=true -Dgwt.skipCompilation=true ${{ env.BUILD_MVN_OPTS }}

  # This override is not required. However, removing it causes the CI build to hang indefinitely.
  - project: dba/kiegroup-jbpm
    build-command:
      current: mvn -e -fae -nsu clean install -Dfull -Denforcer.skip=true -Dcheckstyle.skip=true -Drevapi.skip=true ${{ env.BUILD_MVN_OPTS }}
      downstream: mvn -e -fae -nsu clean install -Dfull -Denforcer.skip=true -Dcheckstyle.skip=true -Drevapi.skip=true ${{ env.BUILD_MVN_OPTS }}

  # Optaplanner is NOT part of BAMOE project.
  # - project: dba/kiegroup-optaplanner
  #   build-command:
  #     current: mvn -e -fae -nsu clean install -Dfull -DskipTests ${{ env.BUILD_MVN_OPTS }}
  #     upstream: mvn -e clean install -DskipTests -Dgwt.compiler.skip=true -Dgwt.skipCompilation=true -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true ${{ env.BUILD_MVN_OPTS }}

  # 1:1 copied from full-downstream-build. Removed tests skip 
  - project: dba/kiegroup-kie-wb-common
    build-command:
      current: mvn ${{ env.BUILD_MVN_OPTS }} -e -nsu -T1C clean install -Dfull
      upstream: mvn ${{ env.BUILD_MVN_OPTS }} -e clean install -DskipTests -Dgwt.compiler.skip=true -Dgwt.skipCompilation=true -Denforcer.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drevapi.skip=true
      downstream: mvn ${{ env.BUILD_MVN_OPTS }} -e -nsu clean install -Dfull -Pbusiness-central,wildfly,sourcemaps,no-showcase -Dcontainer=wildfly -Dcontainer.profile=wildfly -Dintegration-tests=true -Dcargo.ignore.failures=true -Dmaven.test.redirectTestOutputToFile=true -Dgwt.compiler.localWorkers=1 -Dwebdriver.firefox.bin=/opt/tools/firefox-91esr/firefox-bin -Dgwt.skipCompilation=true
    archive-artifacts:
      path: |
        **/target/screenshots/**
  
  # Override required to enable cargo integration tests (1:1 copy from full-downstream-build)
  - project: dba/kiegroup-droolsjbpm-integration
    build-command:
      current: mvn ${{ env.BUILD_MVN_OPTS }} -e -nsu -B -T1C clean install -Dfull -Pjenkins-pr-builder
      downstream: mvn ${{ env.BUILD_MVN_OPTS }} -e -nsu clean install -Dfull -Pbusiness-central,wildfly,sourcemaps,no-showcase,jenkins-pr-builder -Dcontainer=wildfly -Dcontainer.profile=wildfly -Dintegration-tests=true -Dcargo.ignore.failures=true -Dmaven.test.failure.ignore=true -Dmaven.test.redirectTestOutputToFile=true -Dgwt.compiler.localWorkers=1 -Dwebdriver.firefox.bin=/opt/tools/firefox-91esr/firefox-bin -Dgwt.skipCompilation=true

  # In full-downstream-config is skipped, but actually compiled in 8.1 
  # - project: dba/kiegroup-process-migration-service
  #   skip: true

  - project: dba/kiegroup-kie-docs
    skip: true

  - project: dba/kiegroup-droolsjbpm-tools
    skip: true

